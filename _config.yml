title: Linked IT
description: Azure and Microsoft 365 consulting for secure cloud operations, tenant reviews, and practical business outcomes.
url: "https://www.linkedit.au"
baseurl: ""
timezone: Australia/Sydney

permalink: /blog/:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post
      author: Dominic Eames

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
